[project]
name = "currens"
version = "0.1.0"
description = "Collection of tools for working with currency data"
readme = "README.md"
requires-python = ">=3.13"
dependencies =  [
    "sqlalchemy",
    "pandas",
    "requests",
    "python-dotenv>=1.1.0",
    "ruff>=0.11.2",
    "tzdata>=2025.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# gettext's install() (utils/multilanguage_support.py) puts `_` into builtins at runtime.
builtins = ["_"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
